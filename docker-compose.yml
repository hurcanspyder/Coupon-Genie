version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coupon_genie_postgres
    restart: always
    environment:
      POSTGRES_USER: coupon_user
      POSTGRES_PASSWORD: coupon_secure_password
      POSTGRES_DB: coupon_genie
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
